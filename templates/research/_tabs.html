{% with vn=request.resolver_match.view_name %}
<div class="mb-4 flex gap-1 text-sm">
  <a href="{% url 'research:ledger' project.slug %}"
     class="rounded px-2 py-1 {% if vn == 'research:ledger' %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Hypotheses</a>
  <a href="{% url 'research:experiments' project.slug %}"
     class="rounded px-2 py-1 {% if vn == 'research:experiments' %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Experiment log</a>
  <a href="{% url 'research:datasets' project.slug %}"
     class="rounded px-2 py-1 {% if vn == 'research:datasets' %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Datasets</a>
</div>
{% endwith %}
