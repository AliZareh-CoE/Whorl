{% if sentences %}
  <div class="rounded border border-indigo-100 bg-indigo-50/60 p-4 dark:border-indigo-500/20 dark:bg-indigo-500/10">
    <p class="mb-2 text-[10px] font-medium uppercase tracking-wide text-indigo-400">tl;dr</p>
    <ul class="space-y-1.5 text-sm leading-relaxed text-stone-700 dark:text-stone-300">
      {% for sentence in sentences %}<li class="flex gap-2"><span class="select-none text-indigo-300">•</span><span>{{ sentence }}</span></li>{% endfor %}
    </ul>
  </div>
{% else %}
  <p class="text-xs text-stone-400">Nothing to summarize.</p>
{% endif %}
