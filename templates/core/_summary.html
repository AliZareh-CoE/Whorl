{% if sentences %}
  <div class="rounded border border-indigo-100 bg-indigo-50/60 p-3">
    <p class="mb-1 text-[10px] font-medium uppercase tracking-wide text-indigo-400">tl;dr</p>
    <ul class="space-y-1 text-sm text-stone-700">
      {% for sentence in sentences %}<li>• {{ sentence }}</li>{% endfor %}
    </ul>
  </div>
{% else %}
  <p class="text-xs text-stone-400">Nothing to summarize.</p>
{% endif %}
