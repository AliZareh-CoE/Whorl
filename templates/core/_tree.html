<svg viewBox="0 0 100 100" width="{{ size }}" height="{{ size }}" role="img"
     aria-label="Project tree — {{ stage }}, {{ percent }}% complete" data-stage="{{ stage }}"
     class="overflow-visible">
  <!-- ground -->
  <line x1="22" y1="92" x2="78" y2="92" stroke="#d6d3d1" stroke-width="1.5" stroke-linecap="round"/>
  {% if stage == "sprout" %}
    <path d="M50 92 Q50 84 50 {{ canopy_y }}" stroke="#78716c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M50 {{ canopy_y }} Q44 78 42 74" stroke="{{ color }}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="74" r="3.5" fill="{{ color }}" opacity="0.55"/>
    <path d="M50 {{ canopy_y }} Q56 80 58 77" stroke="{{ color }}" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="58" cy="77" r="3" fill="{{ color }}" opacity="0.45"/>
  {% else %}
    <path d="M50 92 Q49 {{ canopy_y|add:10 }} 50 {{ canopy_y }}" stroke="#78716c"
          stroke-width="{% if stage == 'sapling' %}2.5{% else %}4{% endif %}" fill="none" stroke-linecap="round"/>
    {% if branch %}
      <path d="M50 {{ canopy_y|add:14 }} Q42 {{ canopy_y|add:8 }} 38 {{ canopy_y|add:4 }}" stroke="#78716c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M50 {{ canopy_y|add:18 }} Q58 {{ canopy_y|add:12 }} 63 {{ canopy_y|add:8 }}" stroke="#78716c" stroke-width="2" fill="none" stroke-linecap="round"/>
    {% endif %}
    {% for circle in foliage %}
      <circle cx="{{ circle.cx }}" cy="{{ circle.cy }}" r="{{ circle.r }}" fill="{{ color }}" opacity="{{ circle.opacity }}"/>
    {% endfor %}
    {% for blossom in blossoms %}
      <circle cx="{{ blossom.cx }}" cy="{{ blossom.cy }}" r="1.6" fill="#fff" opacity="0.9"/>
    {% endfor %}
  {% endif %}
</svg>
