{% extends "base.html" %}

{% block title %}Delete prompt{% endblock %}

{% block breadcrumbs %}
<a href="{% url 'prompts:gallery' %}" class="hover:underline">Prompts</a> / Delete
{% endblock %}

{% block content %}
<h1 class="mb-4 text-2xl font-semibold tracking-tight">Delete prompt “{{ object.title }}”?</h1>
<form method="post" class="flex items-center gap-3">
  {% csrf_token %}
  <button type="submit" class="rounded bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Delete</button>
  <a href="{% url 'prompts:gallery' %}" class="text-sm text-stone-500 hover:underline">Cancel</a>
</form>
{% endblock %}
