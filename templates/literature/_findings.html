{% if findings %}
  <ul class="space-y-1.5 text-sm">
    {% for finding in findings %}
      <li class="flex items-start gap-2 rounded px-1 py-0.5 transition-colors hover:bg-stone-50 dark:hover:bg-stone-800">
        <span class="mt-0.5 shrink-0 rounded-full px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wide
          {% if finding.level == 'error' %}bg-red-50 text-red-700 dark:bg-red-500/10 dark:text-red-300
          {% elif finding.level == 'warning' %}bg-amber-50 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300
          {% else %}bg-stone-100 text-stone-500 dark:bg-stone-800 dark:text-stone-300{% endif %}">{{ finding.level }}</span>
        <span class="text-stone-600 dark:text-stone-300">{{ finding.message }}
          {% for ref in finding.references %}
            <a href="{{ ref.get_absolute_url }}" class="text-indigo-600 hover:text-indigo-700 dark:text-indigo-400 dark:hover:text-indigo-300">↗</a>
          {% endfor %}
        </span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="text-sm text-green-700 dark:text-green-300">✓ {{ empty }}</p>
{% endif %}
