<td id="cell-{{ cell.theme.pk }}-{{ link.pk }}" class="group px-2 py-2 text-center align-middle">
  <button type="button"
          hx-post="{% url 'literature:toggle_mark' project.slug cell.theme.pk link.pk %}"
          hx-target="#cell-{{ cell.theme.pk }}-{{ link.pk }}" hx-swap="outerHTML"
          title="{% if cell.mark and cell.mark.note %}{{ cell.mark.note }}{% else %}{{ link.reference.bibtex_key }} × {{ cell.theme.name }}{% endif %}"
          class="mx-auto flex h-6 w-6 items-center justify-center rounded border text-xs
            {% if cell.mark %}border-indigo-600 bg-indigo-600 text-white{% else %}border-stone-200 bg-white text-transparent hover:border-stone-400{% endif %}">✓</button>
  {% if cell.mark %}
    <a href="{% url 'literature:mark_note' project.slug cell.mark.pk %}"
       class="block text-[10px] {% if cell.mark.note %}text-indigo-600{% else %}text-stone-300 opacity-0 group-hover:opacity-100{% endif %} hover:underline">
      {% if cell.mark.note %}note{% else %}+ note{% endif %}
    </a>
  {% endif %}
</td>
