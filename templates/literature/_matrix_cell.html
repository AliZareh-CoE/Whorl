<td id="cell-{{ cell.theme.pk }}-{{ link.pk }}" class="group border-l border-stone-100 px-3 py-2 text-center align-middle dark:border-stone-800 {% if cell.mark %}bg-indigo-50/40 dark:bg-indigo-500/15{% endif %}">
  <button type="button"
          hx-post="{% url 'literature:toggle_mark' project.slug cell.theme.pk link.pk %}"
          hx-target="#cell-{{ cell.theme.pk }}-{{ link.pk }}" hx-swap="outerHTML"
          title="{% if cell.mark and cell.mark.note %}{{ cell.mark.note }}{% else %}{{ link.reference.bibtex_key }} × {{ cell.theme.name }}{% endif %}"
          class="mx-auto flex h-6 w-6 items-center justify-center rounded border text-xs transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500/40
            {% if cell.mark %}border-indigo-600 bg-indigo-600 text-white shadow-sm hover:bg-indigo-700{% else %}border-stone-200 bg-white text-transparent hover:border-indigo-400 hover:text-indigo-200 dark:border-stone-700 dark:bg-stone-800{% endif %}">✓</button>
  {% if cell.mark %}
    <a href="{% url 'literature:mark_note' project.slug cell.mark.pk %}"
       class="mt-1 block text-[10px] transition-opacity {% if cell.mark.note %}font-medium text-indigo-600 dark:text-indigo-400{% else %}text-stone-400 opacity-0 group-hover:opacity-100{% endif %} hover:underline">
      {% if cell.mark.note %}note{% else %}+ note{% endif %}
    </a>
  {% endif %}
</td>
