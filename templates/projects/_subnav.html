{% with vn=request.resolver_match.view_name %}
<div class="mb-6 flex items-center gap-1 border-b border-stone-200 pb-2 text-sm">
  <span class="mr-3 inline-block h-3 w-3 rounded-full" style="background: {{ project.color }}"></span>
  <a href="{% url 'projects:overview' project.slug %}"
     class="rounded px-2 py-1 {% if vn == 'projects:overview' %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Overview</a>
  <a href="{% url 'plans:plan' project.slug %}"
     class="rounded px-2 py-1 {% if 'plans:plan' in vn or 'phase' in vn or 'milestone' in vn or 'task' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Plan</a>
  <a href="{% url 'documents:index' project.slug %}"
     class="rounded px-2 py-1 {% if 'documents:' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Documents</a>
  <a href="{% url 'literature:project' project.slug %}"
     class="rounded px-2 py-1 {% if 'literature:project' in vn or 'literature:queue' in vn or 'literature:report' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Literature</a>
  <a href="{% url 'plans:questions' project.slug %}"
     class="rounded px-2 py-1 {% if 'question' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Questions</a>
  <a href="{% url 'writing:project' project.slug %}"
     class="rounded px-2 py-1 {% if 'writing:' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Writing</a>
  <a href="{% url 'notes:list' project.slug %}"
     class="rounded px-2 py-1 {% if vn == 'notes:list' or vn == 'notes:detail' or vn == 'notes:create' or vn == 'notes:edit' %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Notes</a>
  <a href="{% url 'projects:graph' project.slug %}"
     class="rounded px-2 py-1 {% if 'graph' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Graph</a>
  <a href="{% url 'projects:decisions' project.slug %}"
     class="rounded px-2 py-1 {% if 'decision' in vn %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">Decisions</a>
  <span class="ml-auto"></span>
  <a href="{% url 'projects:edit' project.slug %}" class="rounded px-2 py-1 text-stone-500 hover:bg-stone-50">Edit</a>
</div>
{% endwith %}
