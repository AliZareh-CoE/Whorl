{% extends "base.html" %}

{% block title %}Delete decision · {{ project.name }}{% endblock %}

{% block breadcrumbs %}
<a href="{% url 'projects:list' %}" class="hover:underline">Projects</a> /
<a href="{{ project.get_absolute_url }}" class="hover:underline">{{ project.name }}</a> /
<a href="{% url 'projects:decisions' project.slug %}" class="hover:underline">Decisions</a> / Delete
{% endblock %}

{% block content %}
<h1 class="mb-4 text-2xl font-semibold tracking-tight dark:text-stone-100">Delete decision “{{ object.title }}”?</h1>
<form method="post" class="flex items-center gap-3">
  {% csrf_token %}
  <button type="submit" class="rounded bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Delete</button>
  <a href="{% url 'projects:decisions' project.slug %}" class="text-sm text-stone-500 hover:underline dark:text-stone-400">Cancel</a>
</form>
{% endblock %}
