{# Shared modal shell (Owner idea #18): HTMX swaps this into #modal-slot. #}
<div x-data @keydown.escape.window="$root.remove()"
     class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-stone-900/40" @click="$root.remove()" aria-hidden="true"></div>
  <div role="dialog" aria-modal="true" aria-label="{{ modal_title }}"
       class="relative max-h-[85vh] w-full max-w-lg overflow-y-auto rounded-lg border border-stone-200 bg-white p-6 shadow-xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold tracking-tight">{{ modal_title }}</h2>
      <button type="button" @click="$root.remove()" aria-label="Close"
              class="rounded px-2 py-1 text-stone-400 hover:bg-stone-100 hover:text-stone-600">✕</button>
    </div>
    <form method="post" action="{{ request.path }}"
          hx-post="{{ request.get_full_path }}" hx-target="#modal-slot" hx-swap="innerHTML"
          class="space-y-4">
      {% csrf_token %}
      {% include "_fields.html" %}
      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="rounded bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Save</button>
        <button type="button" @click="$root.remove()"
                class="text-sm text-stone-500 hover:underline">Cancel</button>
      </div>
    </form>
  </div>
</div>
