<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Atlas</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="h-full bg-stone-50 text-stone-900 antialiased flex items-center justify-center">
  <div class="w-full max-w-sm">
    <h1 class="mb-1 text-2xl font-semibold tracking-tight">Atlas</h1>
    <p class="mb-8 text-sm text-stone-500">Your research, in one organized place.</p>
    {% if form.errors %}
      <div class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-2 text-sm text-red-700">
        Your username and password didn't match. Please try again.
      </div>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_username" class="block text-sm font-medium mb-1">Username</label>
        <input type="text" name="username" id="id_username" autofocus required
               class="w-full rounded border border-stone-300 bg-white px-3 py-2 text-sm focus:border-indigo-600 focus:outline-none">
      </div>
      <div>
        <label for="id_password" class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" id="id_password" required
               class="w-full rounded border border-stone-300 bg-white px-3 py-2 text-sm focus:border-indigo-600 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full rounded bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Log in
      </button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</body>
</html>
