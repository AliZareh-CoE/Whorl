<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas</title>
  {% load static %}
  <script>
    // Apply the effective theme before paint (no flash): an explicit saved choice wins,
    // otherwise follow the OS prefers-color-scheme. The toggle records an explicit choice;
    // with none stored we keep tracking the OS live. Dark mode is complete app-wide now (#273).
    (function () {
      var mql = window.matchMedia("(prefers-color-scheme: dark)");
      function stored() { try { return localStorage.getItem("theme"); } catch (e) { return null; } }
      function apply() {
        var t = stored();
        var dark = t === "dark" || (t !== "light" && mql.matches);
        document.documentElement.classList.toggle("dark", dark);
      }
      apply();
      window.__toggleTheme = function () {
        var dark = document.documentElement.classList.toggle("dark");
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      };
      if (mql.addEventListener) mql.addEventListener("change", function () { if (!stored()) apply(); });
      // Calm mode (#275): reflect the saved preference as a class before paint, so calm: CSS
      // applies without a flash. The in-app toggle keeps it in sync live.
      try { if (localStorage.getItem("atlas-calm") === "1") document.documentElement.classList.add("calm"); } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="h-full bg-stone-50 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
  <div id="root" class="h-full"></div>
  <noscript>
    <p class="p-8 text-sm">The Atlas app needs JavaScript. The classic pages remain at <a class="underline" href="/">/</a>.</p>
  </noscript>
  <script type="module" src="{% static 'js/spa.js' %}"></script>
</body>
</html>
