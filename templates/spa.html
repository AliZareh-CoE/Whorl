<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas</title>
  {% load static %}
  <script>
    // Apply the saved theme before paint (no flash); expose the toggle (#270).
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark") // opt-in only until dark mode is complete
          document.documentElement.classList.add("dark");
      } catch (e) {}
      window.__toggleTheme = function () {
        var dark = document.documentElement.classList.toggle("dark");
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      };
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="h-full bg-stone-50 text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
  <div id="root" class="h-full"></div>
  <noscript>
    <p class="p-8 text-sm">The Atlas app needs JavaScript. The classic pages remain at <a class="underline" href="/">/</a>.</p>
  </noscript>
  <script type="module" src="{% static 'js/spa.js' %}"></script>
</body>
</html>
