{% if form.non_field_errors %}
  <div class="rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
    {{ form.non_field_errors }}
  </div>
{% endif %}
{% for field in form %}
  <div class="space-y-1.5">
    <label for="{{ field.id_for_label }}" class="block text-xs font-medium uppercase tracking-wide text-stone-500">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="text-xs leading-relaxed text-stone-400">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<p class="text-xs font-medium text-red-600">{{ field.errors.0 }}</p>{% endif %}
  </div>
{% endfor %}
