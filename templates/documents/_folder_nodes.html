{% for node in nodes %}
  {% if node.children %}
    <details open class="ml-1">
      <summary class="cursor-pointer rounded px-1 py-0.5 text-stone-600 hover:bg-stone-50">
        <a href="?folder={{ node.folder.pk }}"
           class="{% if current_folder == node.folder %}font-medium text-stone-900{% endif %} hover:underline">{{ node.folder.name }}</a>
      </summary>
      <div class="ml-3 border-l border-stone-100 pl-1">
        {% include "documents/_folder_nodes.html" with nodes=node.children %}
      </div>
    </details>
  {% else %}
    <a href="?folder={{ node.folder.pk }}"
       class="ml-1 block rounded px-1 py-0.5 {% if current_folder == node.folder %}bg-stone-100 font-medium{% else %}text-stone-600 hover:bg-stone-50{% endif %}">{{ node.folder.name }}</a>
  {% endif %}
{% endfor %}
