{% for node in nodes %}
  {% if node.children %}
    <details open class="ml-1">
      <summary class="cursor-pointer rounded px-2 py-1 text-stone-600 dark:text-stone-300 transition-colors hover:bg-stone-50 dark:hover:bg-stone-800">
        <a href="?folder={{ node.folder.pk }}"
           class="{% if current_folder == node.folder %}font-medium text-indigo-700 dark:text-indigo-400{% endif %} hover:underline">{{ node.folder.name }}</a>
      </summary>
      <div class="ml-3 border-l border-stone-100 dark:border-stone-800 pl-1">
        {% include "documents/_folder_nodes.html" with nodes=node.children %}
      </div>
    </details>
  {% else %}
    <a href="?folder={{ node.folder.pk }}"
       class="ml-1 block rounded px-2 py-1 transition-colors {% if current_folder == node.folder %}bg-indigo-50 dark:bg-indigo-500/15 font-medium text-indigo-700 dark:text-indigo-400{% else %}text-stone-600 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-800{% endif %}">{{ node.folder.name }}</a>
  {% endif %}
{% endfor %}
