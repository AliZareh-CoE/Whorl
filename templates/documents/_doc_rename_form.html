<tr id="doc-{{ doc.pk }}" class="border-b border-stone-100 dark:border-stone-800 bg-indigo-50/40 dark:bg-indigo-500/15">
  <td colspan="6" class="py-2 pr-4 pl-4">
    <form hx-post="{% url 'documents:rename' project.slug doc.pk %}"
          hx-target="#doc-{{ doc.pk }}" hx-swap="outerHTML" class="flex items-center gap-2">
      <input type="text" name="title" value="{{ doc.title }}" maxlength="300" autofocus
             class="flex-1 rounded border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-800 px-2.5 py-1.5 text-sm transition-colors focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 focus:outline-none">
      <button type="submit" class="rounded bg-indigo-600 px-3 py-1.5 text-xs font-medium text-white transition-colors hover:bg-indigo-700">Save</button>
      <button type="button" hx-get="{% url 'documents:rename' project.slug doc.pk %}?cancel=1"
              hx-target="#doc-{{ doc.pk }}" hx-swap="outerHTML"
              class="text-xs text-stone-500 dark:text-stone-400 transition-colors hover:text-stone-700 dark:hover:text-stone-300 hover:underline">Cancel</button>
    </form>
  </td>
</tr>
