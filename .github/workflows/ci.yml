name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test, lint, type-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      SECRET_KEY: ci-secret-not-for-production
      DEBUG: "true"
      ATLAS_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: uv sync

      - name: Lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Node (for the frontend type-check + build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend type-check
        run: cd frontend && npm install && npm run check

      - name: Built assets are committed (not stale)
        run: |
          make css
          make js
          git diff --exit-code static/css/app.css static/js \
            || (echo "::error::Committed CSS/JS is stale — run 'make css && make js' and commit"; exit 1)

  audit:
    name: Security audit sweep
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      SECRET_KEY: ci-secret-not-for-production
      DEBUG: "true"
      ATLAS_API_KEY: ci-audit-key
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Python deps
        run: uv sync

      - name: Migrate
        run: uv run python manage.py migrate

      - name: Boot the app
        run: |
          nohup uv run python manage.py runserver 0.0.0.0:8000 > /tmp/server.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/login/ > /dev/null && ok=1 && break
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Server never came up"; cat /tmp/server.log; exit 1
          fi

      - name: Probe sweep (make audit)
        run: |
          set -o pipefail
          make audit 2>&1 | tee /tmp/audit-output.txt

      - name: Smoke login user
        run: |
          DJANGO_SUPERUSER_PASSWORD=ci-smoke-pass uv run python manage.py createsuperuser \
            --noinput --username owner --email owner@example.com

      - name: Playwright browser
        run: |
          uv pip install playwright
          uv run playwright install --with-deps chromium

      - name: Editor smoke (headless Playwright battery)
        env:
          SMOKE_PASS: ci-smoke-pass
          ATLAS_API_KEY: ci-audit-key
        run: uv run python scripts/editor_smoke.py

      - name: Upload smoke artifacts (screenshot, console, failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-smoke-artifacts
          path: |
            /tmp/editor-smoke/
            /tmp/server.log
            /tmp/audit-output.txt
          if-no-files-found: ignore
