name: Desktop release

# Builds the Atlas desktop app (Tauri) into ready-to-install binaries for Linux and
# Windows and attaches them to a GitHub Release. Triggered by pushing a version tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or manually from the Actions tab.
#
# Owner-requested (2026-06-14): "ready-to-install stuff for Linux and Windows".
# The actual binaries are produced here in CI — they can't be built in the headless
# dev container, so this workflow IS the delivery mechanism.

on:
  # One-click-free path (owner asked for "one click install"): auto-build the installers
  # whenever the desktop app or this workflow changes, publishing to a rolling
  # "desktop-preview" draft release. Also still runs on a version tag or a manual dispatch.
  push:
    branches:
      - "claude/atlas-build-loop-qnf8a8"
      - "claude/desktop-app-project-tl12ri"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
      # the frozen server bundles these Django sources, so a fix here must rebuild the
      # installer too — they're not under desktop/.
      - "core/management/commands/run_desktop.py"
      - "config/settings/desktop.py"
      - "mcp_server/**"
      - "pyproject.toml"
      # the frozen server also bundles the templates and the built static assets (JS + the
      # Tailwind CSS compiled from these), so a UI change must rebuild the installer too.
      - "templates/**"
      - "static/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write # create the release + upload installers

jobs:
  build:
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc/webkit baseline broad for the .deb/.AppImage/.rpm
          - platform: ubuntu-22.04
            target-args: ""
          - platform: windows-latest
            target-args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Stamp a unique build version
        shell: bash
        run: |
          # Bump the app version every build (0.1.<run-number>). A FIXED version is why the
          # owner kept running old code: the .msi sees "same version already installed" and
          # skips replacing files, and same-named installers get served from cache. A unique
          # version forces a real upgrade and a uniquely-named installer.
          VER="0.1.${{ github.run_number }}"
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' desktop/tauri.conf.json > "$tmp" && mv "$tmp" desktop/tauri.conf.json
          # keep Cargo.toml's package version in lockstep so the server can read it
          # (env!("CARGO_PKG_VERSION")) to skip re-collecting static on repeat launches (#241).
          sed -i.bak "s/^version = \".*\"/version = \"$VER\"/" desktop/Cargo.toml && rm -f desktop/Cargo.toml.bak
          echo "Atlas desktop version = $VER"
          grep '"version"' desktop/tauri.conf.json | head -1
          grep '^version' desktop/Cargo.toml | head -1

      # In-app updates (owner, 2026-09-06): updater artifacts (.sig + latest.json) are signed
      # with the private key held ONLY in the TAURI_SIGNING_PRIVATE_KEY secret. Flip the flag
      # on when the secret is present so builds stay green before the secret exists.
      - name: Enable signed updater artifacts when the signing key is configured
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = true' desktop/tauri.conf.json > "$tmp" && mv "$tmp" desktop/tauri.conf.json
          echo "updater artifacts: ON"

      # The rolling desktop-preview release keeps only the newest build: delete assets from
      # earlier versions (this run's other-platform assets share the version stamp and stay).
      - name: Publish the preview release before uploading
        if: github.ref == 'refs/heads/claude/atlas-build-loop-qnf8a8' || github.ref == 'refs/heads/claude/desktop-app-project-tl12ri'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          # stale DRAFT copies of the preview (drafts are invisible to the by-tag lookup and to
          # the in-app updater) — delete them so there is exactly one preview release
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases?per_page=50" \
            | jq -r '.[] | select(.draft and .tag_name == "desktop-preview") | .id' \
            | while read -r did; do echo "delete stale draft release $did"; curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/$did" >/dev/null; done
          rid=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/desktop-preview" | jq -r '.id // empty')
          if [ -z "$rid" ]; then echo "no preview release yet"; exit 0; fi
          # the preview used to be a draft; the in-app updater can only fetch a published release
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"draft": false, "prerelease": true}' "$api/releases/$rid" >/dev/null && echo "preview release published (prerelease)"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # --- Self-contained server (#210f, #266): freeze the Django server (SQLite, no DB
      # server) so the installer carries everything and the app needs no Python/Docker. ---
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install build deps (PyInstaller)
        run: uv sync --group build

      # Build the Tailwind stylesheet (static/css/app.css is a gitignored build artifact, so a
      # fresh checkout has no CSS — without this the frozen app served an unstyled page). Must
      # run BEFORE the freeze, which bundles static/ into the executable.
      - name: Build Tailwind CSS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sL --fail -o tw.exe https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-windows-x64.exe
            ./tw.exe -i assets/css/app.css -o static/css/app.css --minify
          else
            curl -sL --fail -o tw https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
            chmod +x tw
            ./tw -i assets/css/app.css -o static/css/app.css --minify
          fi
          test -s static/css/app.css

      - name: Freeze the Atlas server
        run: uv run pyinstaller desktop/server/atlas_server.spec --noconfirm --distpath desktop/server/dist --workpath ${{ runner.temp }}/pyi

      # The MCP server ships too (atlas-mcp), so Claude Code can drive the installed app with
      # `claude mcp add atlas -- <path>` — no Python on the machine.
      - name: Freeze the Atlas MCP server
        run: uv run pyinstaller desktop/server/atlas_mcp.spec --noconfirm --distpath desktop/server/dist --workpath ${{ runner.temp }}/pyi-mcp

      # The desktop shell loads the bundled server (frontendDist is only a Tauri formality),
      # so there is no Node/Vite build step needed for the bundle.
      - name: Build and release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts when the secret exists (see the flag step above).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # A manual dispatch or version tag publishes under that name; an automatic
          # build-on-push rolls a single "desktop-preview" release so there's always one
          # stable place to download the latest installers.
          tagName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'desktop-preview' }}
          releaseName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'Atlas desktop preview' }}
          releaseBody: "Ready-to-install Atlas desktop builds. Pick the file for your OS below. Installed apps update themselves from this release."
          # Published (not draft) so the in-app updater can fetch latest.json + installers;
          # marked prerelease so it never shadows a tagged v* release as "latest".
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: ${{ matrix.target-args }}

  # Older installers are pruned only AFTER every platform has uploaded, so the release never
  # has a window where an OS has no installer (the owner hit that: "I can't find the exe").
  # A failed platform keeps its previous installer in place.
  prune:
    name: Prune older installers
    needs: build
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/claude/atlas-build-loop-qnf8a8' || github.ref == 'refs/heads/claude/desktop-app-project-tl12ri')
    runs-on: ubuntu-latest
    steps:
      - name: Delete installers from earlier runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: 0.1.${{ github.run_number }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          rel=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/desktop-preview")
          echo "$rel" | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r aid name; do
            case "$name" in *"$VER"*|latest.json) echo "keep $name" ;; *) echo "delete $name"; curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$aid" >/dev/null ;; esac
          done
