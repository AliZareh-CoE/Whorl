name: Desktop release

# Builds the Atlas desktop app (Tauri) into ready-to-install binaries for Linux and
# Windows and attaches them to a GitHub Release. Triggered by pushing a version tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or manually from the Actions tab.
#
# Owner-requested (2026-06-14): "ready-to-install stuff for Linux and Windows".
# The actual binaries are produced here in CI — they can't be built in the headless
# dev container, so this workflow IS the delivery mechanism.

on:
  # One-click-free path (owner asked for "one click install"): auto-build the installers
  # whenever the desktop app or this workflow changes, publishing to a rolling
  # "desktop-preview" draft release. Also still runs on a version tag or a manual dispatch.
  push:
    branches:
      - "claude/atlas-build-loop-qnf8a8"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
      # the frozen server bundles these Django sources, so a fix here (e.g. the bundled-
      # Postgres lifecycle) must rebuild the installer too — they're not under desktop/.
      - "core/desktop_runtime.py"
      - "core/management/commands/run_desktop.py"
      - "config/settings/desktop.py"
      - "pyproject.toml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write # create the release + upload installers

jobs:
  build:
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc/webkit baseline broad for the .deb/.AppImage/.rpm
          - platform: ubuntu-22.04
            target-args: ""
          - platform: windows-latest
            target-args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # --- Self-contained server (#210f/#210i): freeze the Django server + bundle Postgres,
      # so the installer carries everything and the app needs no Python/Postgres/Docker. ---
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install build deps (PyInstaller)
        run: uv sync --group build

      - name: Freeze the Atlas server
        run: uv run pyinstaller desktop/server/atlas_server.spec --noconfirm --distpath desktop/server/dist --workpath ${{ runner.temp }}/pyi

      - name: Bundle Postgres binaries (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          PG_VER=16.4.0
          curl -fL -o /tmp/pg.jar "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-linux-amd64/${PG_VER}/embedded-postgres-binaries-linux-amd64-${PG_VER}.jar"
          mkdir -p /tmp/pgjar desktop/resources/pg
          unzip -oq /tmp/pg.jar -d /tmp/pgjar
          tar -xJf "$(ls /tmp/pgjar/*.txz)" -C desktop/resources/pg
          test -x desktop/resources/pg/bin/initdb

      - name: Bundle Postgres binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PG_VER = "16.4.0"
          curl.exe -fL -o pg.jar "https://repo1.maven.org/maven2/io/zonky/test/postgres/embedded-postgres-binaries-windows-amd64/$PG_VER/embedded-postgres-binaries-windows-amd64-$PG_VER.jar"
          New-Item -ItemType Directory -Force pgjar, desktop/resources/pg | Out-Null
          Expand-Archive pg.jar -DestinationPath pgjar -Force
          $txz = Get-ChildItem pgjar/*.txz | Select-Object -First 1
          tar -xf $txz.FullName -C desktop/resources/pg
          if (-not (Test-Path desktop/resources/pg/bin/initdb.exe)) { throw "initdb.exe missing" }

      # The desktop shell loads the bundled server (frontendDist is only a Tauri formality),
      # so there is no Node/Vite build step needed for the bundle.
      - name: Build and release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # D2 (auto-update) will add TAURI_SIGNING_PRIVATE_KEY here once the owner
          # generates the updater keypair; unsigned bundles still install fine.
        with:
          projectPath: desktop
          # A manual dispatch or version tag publishes under that name; an automatic
          # build-on-push rolls a single "desktop-preview" release so there's always one
          # stable place to download the latest installers.
          tagName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'desktop-preview' }}
          releaseName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'Atlas desktop preview' }}
          releaseBody: "Ready-to-install Atlas desktop builds. Pick the file for your OS below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target-args }}
