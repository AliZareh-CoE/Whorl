name: Desktop release

# Builds the Atlas desktop app (Tauri) into ready-to-install binaries for Linux and
# Windows and attaches them to a GitHub Release. Triggered by pushing a version tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`) or manually from the Actions tab.
#
# Owner-requested (2026-06-14): "ready-to-install stuff for Linux and Windows".
# The actual binaries are produced here in CI — they can't be built in the headless
# dev container, so this workflow IS the delivery mechanism.

on:
  # One-click-free path (owner asked for "one click install"): auto-build the installers
  # whenever the desktop app or this workflow changes, publishing to a rolling
  # "desktop-preview" draft release. Also still runs on a version tag or a manual dispatch.
  push:
    branches:
      - "claude/atlas-build-loop-qnf8a8"
      - "claude/desktop-app-project-tl12ri"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
      # the frozen server bundles these Django sources, so a fix here must rebuild the
      # installer too — they're not under desktop/.
      - "core/management/commands/run_desktop.py"
      - "config/settings/desktop.py"
      - "mcp_server/**"
      - "pyproject.toml"
      # the frozen server also bundles the templates and the built static assets (JS + the
      # Tailwind CSS compiled from these), so a UI change must rebuild the installer too.
      - "templates/**"
      - "static/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write # create the release + upload installers

jobs:
  build:
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc/webkit baseline broad for the .deb/.AppImage/.rpm
          - platform: ubuntu-22.04
            target-args: ""
          - platform: windows-latest
            target-args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40  # the release notes list the last commits

      - name: Stamp a unique build version
        shell: bash
        run: |
          # Bump the app version every build (0.1.<run-number>). A FIXED version is why the
          # owner kept running old code: the .msi sees "same version already installed" and
          # skips replacing files, and same-named installers get served from cache. A unique
          # version forces a real upgrade and a uniquely-named installer.
          VER="0.1.${{ github.run_number }}"
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' desktop/tauri.conf.json > "$tmp" && mv "$tmp" desktop/tauri.conf.json
          # keep Cargo.toml's package version in lockstep so the server can read it
          # (env!("CARGO_PKG_VERSION")) to skip re-collecting static on repeat launches (#241).
          sed -i.bak "s/^version = \".*\"/version = \"$VER\"/" desktop/Cargo.toml && rm -f desktop/Cargo.toml.bak
          echo "Atlas desktop version = $VER"
          grep '"version"' desktop/tauri.conf.json | head -1
          grep '^version' desktop/Cargo.toml | head -1

      # In-app updates (owner, 2026-09-06): updater artifacts (.sig + latest.json) are signed
      # with the private key held ONLY in the TAURI_SIGNING_PRIVATE_KEY secret. Flip the flag
      # on when the secret is present so builds stay green before the secret exists.
      - name: Write release notes
        id: notes
        shell: bash
        run: |
          # The updater shows these before installing (#370): what changed, from the feat/fix
          # commit subjects since the previous build, newest first. Static text told the
          # owner nothing.
          VER="0.1.${{ github.run_number }}"
          {
            echo "body<<NOTES_EOF"
            echo "Atlas desktop $VER — ready-to-install builds. Pick the file for your OS below; installed apps update themselves from this release."
            echo
            echo "What changed recently:"
            git log --no-merges --format='%s' -n 40 | grep -E '^(feat|fix|perf)' | head -12 | sed 's/^/- /'
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enable signed updater artifacts when the signing key is configured
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = true' desktop/tauri.conf.json > "$tmp" && mv "$tmp" desktop/tauri.conf.json
          echo "updater artifacts: ON"

      # The rolling desktop-preview release keeps only the newest build: delete assets from
      # earlier versions (this run's other-platform assets share the version stamp and stay).
      - name: Publish the preview release before uploading
        if: github.ref == 'refs/heads/claude/atlas-build-loop-qnf8a8' || github.ref == 'refs/heads/claude/desktop-app-project-tl12ri'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          # stale DRAFT copies of the preview (drafts are invisible to the by-tag lookup and to
          # the in-app updater) — delete them so there is exactly one preview release
          curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases?per_page=50" \
            | jq -r '.[] | select(.draft and .tag_name == "desktop-preview") | .id' \
            | while read -r did; do echo "delete stale draft release $did"; curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/$did" >/dev/null; done
          rid=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/desktop-preview" | jq -r '.id // empty')
          if [ -z "$rid" ]; then echo "no preview release yet"; exit 0; fi
          # the preview used to be a draft; the in-app updater can only fetch a published release
          curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"draft": false, "prerelease": true}' "$api/releases/$rid" >/dev/null && echo "preview release published (prerelease)"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # --- Self-contained server (#210f, #266): freeze the Django server (SQLite, no DB
      # server) so the installer carries everything and the app needs no Python/Docker. ---
      - name: Set up Python + uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install build deps (PyInstaller)
        run: uv sync --group build

      # Build the Tailwind stylesheet (static/css/app.css is a gitignored build artifact, so a
      # fresh checkout has no CSS — without this the frozen app served an unstyled page). Must
      # run BEFORE the freeze, which bundles static/ into the executable.
      - name: Build Tailwind CSS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sL --fail -o tw.exe https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-windows-x64.exe
            ./tw.exe -i assets/css/app.css -o static/css/app.css --minify
          else
            curl -sL --fail -o tw https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
            chmod +x tw
            ./tw -i assets/css/app.css -o static/css/app.css --minify
          fi
          test -s static/css/app.css

      # The LaTeX engine ships inside the installer (Owner report 2026-09-06: Recompile
      # failed on every desktop build because no engine was bundled). Tectonic is a single
      # static binary; it fetches its TeX bundle on first compile.
      - name: Fetch the Tectonic LaTeX engine
        shell: bash
        run: |
          set -e
          mkdir -p bin
          V=0.15.0
          BASE="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40$V"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sL --fail -o tectonic.zip "$BASE/tectonic-$V-x86_64-pc-windows-msvc.zip" \
              && unzip -o -q tectonic.zip -d bin && rm -f tectonic.zip \
              || echo "::warning::Tectonic download failed — this build compiles LaTeX only with a tectonic on PATH"
          else
            curl -sL --fail -o tectonic.tar.gz "$BASE/tectonic-$V-x86_64-unknown-linux-musl.tar.gz" \
              && tar -xzf tectonic.tar.gz -C bin && rm -f tectonic.tar.gz && chmod +x bin/tectonic \
              || echo "::warning::Tectonic download failed — this build compiles LaTeX only with a tectonic on PATH"
          fi
          ls -la bin || true

      - name: Freeze the Atlas server
        run: uv run pyinstaller desktop/server/atlas_server.spec --noconfirm --distpath desktop/server/dist --workpath ${{ runner.temp }}/pyi

      # The MCP server ships too (atlas-mcp), so Claude Code can drive the installed app with
      # `claude mcp add atlas -- <path>` — no Python on the machine.
      - name: Freeze the Atlas MCP server
        run: uv run pyinstaller desktop/server/atlas_mcp.spec --noconfirm --distpath desktop/server/dist --workpath ${{ runner.temp }}/pyi-mcp

      # Boot the frozen server exactly as the desktop shell will (owner reports 2026-09-06:
      # every failure so far happened only in the installed build). Setup, serve, hit the login
      # page and the API's diagnostics, and check the bundled LaTeX engine is found — on the
      # same OS the installer targets. The log is printed on failure.
      - name: Smoke-test the frozen server
        shell: bash
        env:
          ATLAS_DATA_DIR: ${{ runner.temp }}/atlas-smoke
          ATLAS_PORT: "8765"
          ATLAS_VERSION: 0.1.${{ github.run_number }}
        run: |
          set -e
          BIN=desktop/server/dist/atlas-server/atlas-server
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"
          mkdir -p "$ATLAS_DATA_DIR"
          "$BIN" --setup-only
          "$BIN" &
          SERVER=$!
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8765/login/ && break; sleep 1; done
          if ! curl -sf -o /dev/null http://127.0.0.1:8765/login/; then
            echo "::error::frozen server did not answer on :8765"; cat "$ATLAS_DATA_DIR/atlas-server.log" || true; kill $SERVER || true; exit 1
          fi
          KEY=$(cat "$ATLAS_DATA_DIR/api_key" 2>/dev/null || true)
          DIAG=$(curl -sf -H "X-API-Key: $KEY" http://127.0.0.1:8765/api/v1/diagnostics/ || echo '{}')
          echo "$DIAG" | head -c 600; echo
          echo "$DIAG" | grep -q '"engine": *"[^"]*tectonic' || { echo "::error::bundled LaTeX engine not found by the frozen server"; cat "$ATLAS_DATA_DIR/atlas-server.log" || true; kill $SERVER || true; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:8765/static/js/spa.js || { echo "::error::SPA bundle not served"; kill $SERVER || true; exit 1; }
          kill $SERVER || true
          echo "frozen server smoke test passed"

      # The desktop shell loads the bundled server (frontendDist is only a Tauri formality),
      # so there is no Node/Vite build step needed for the bundle.
      - name: Build and release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts when the secret exists (see the flag step above).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          # A manual dispatch or version tag publishes under that name; an automatic
          # build-on-push rolls a single "desktop-preview" release so there's always one
          # stable place to download the latest installers.
          tagName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'desktop-preview' }}
          releaseName: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'Atlas desktop preview' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Published (not draft) so the in-app updater can fetch latest.json + installers;
          # marked prerelease so it never shadows a tagged v* release as "latest".
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: ${{ matrix.target-args }}

  # Older installers are pruned only AFTER every platform has uploaded, so the release never
  # has a window where an OS has no installer (the owner hit that: "I can't find the exe").
  # A failed platform keeps its previous installer in place.
  prune:
    name: Prune older installers
    needs: build
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/claude/atlas-build-loop-qnf8a8' || github.ref == 'refs/heads/claude/desktop-app-project-tl12ri')
    runs-on: ubuntu-latest
    steps:
      - name: Delete installers from earlier runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: 0.1.${{ github.run_number }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}"
          rel=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/desktop-preview")
          echo "$rel" | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r aid name; do
            case "$name" in *"$VER"*|latest.json) echo "keep $name" ;; *) echo "delete $name"; curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$aid" >/dev/null ;; esac
          done

  # AUTO-UPDATE FEED (owner question, 2026-09-06: "is it working?"). Signing works, but this
  # repository is PRIVATE, so the installed app's unauthenticated fetch of latest.json gets a
  # 404 and no update is ever found. Fix: mirror this run's installers, .sig files and a
  # rewritten latest.json into a PUBLIC releases repository (the app's first updater endpoint).
  # Needs two secrets: RELEASES_REPO (e.g. AliZareh-CoE/atlas-releases — create it public and
  # empty) and RELEASES_TOKEN (a fine-grained PAT with Contents: read+write on that repo).
  # Without them the step explains itself and exits 0. Making this repo public works too.
  mirror:
    name: Mirror the release to the public update feed
    needs: build
    if: always() && needs.build.result == 'success' && (github.ref == 'refs/heads/claude/atlas-build-loop-qnf8a8' || github.ref == 'refs/heads/claude/desktop-app-project-tl12ri')
    runs-on: ubuntu-latest
    steps:
      - name: Copy installers, signatures and latest.json to the public feed
        shell: bash
        env:
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DST_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          DST_REPO: ${{ secrets.RELEASES_REPO }}
          SRC_REPO: ${{ github.repository }}
          VER: 0.1.${{ github.run_number }}
        run: |
          set -e
          if [ -z "$DST_REPO" ] || [ -z "$DST_TOKEN" ]; then
            echo "::warning::RELEASES_REPO / RELEASES_TOKEN not set — the public update feed was not refreshed. Installed apps cannot read a private repo's releases."
            exit 0
          fi
          src="https://api.github.com/repos/$SRC_REPO"; dst="https://api.github.com/repos/$DST_REPO"
          rel=$(curl -sS -H "Authorization: Bearer $SRC_TOKEN" "$src/releases/tags/desktop-preview")
          mkdir -p mirror
          echo "$rel" | jq -r --arg v "$VER" '.assets[] | select((.name | contains($v)) or .name == "latest.json") | "\(.id) \(.name)"' | while read -r aid name; do
            curl -sSL -H "Authorization: Bearer $SRC_TOKEN" -H "Accept: application/octet-stream" -o "mirror/$name" "$src/releases/assets/$aid"
            echo "fetched $name"
          done
          test -s mirror/latest.json
          # the feed must point at the public copies (case-insensitive: GitHub mixes cases)
          sed -i "s#github.com/$SRC_REPO/#github.com/$DST_REPO/#Ig" mirror/latest.json
          grep -q "$DST_REPO" mirror/latest.json
          drel=$(curl -sS -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/tags/desktop-preview")
          did=$(echo "$drel" | jq -r '.id // empty')
          if [ -z "$did" ]; then
            did=$(curl -sS -X POST -H "Authorization: Bearer $DST_TOKEN" -H "Content-Type: application/json" \
              -d '{"tag_name":"desktop-preview","name":"Atlas desktop preview","body":"Ready-to-install Atlas desktop builds. Installed apps update themselves from this release.","prerelease":true}' \
              "$dst/releases" | jq -r '.id')
            echo "created public preview release $did"
          fi
          # replace latest.json first (names are unique per release), then add the new files,
          # then drop older versions — so the feed never points at a missing installer
          curl -sS -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/$did/assets?per_page=100" \
            | jq -r '.[] | select(.name == "latest.json") | .id' \
            | while read -r a; do curl -sS -X DELETE -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/assets/$a" >/dev/null; done
          for f in mirror/*; do
            n=$(basename "$f")
            if [ "$n" != "latest.json" ]; then
              curl -sS -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/$did/assets?per_page=100" | jq -r --arg n "$n" '.[] | select(.name == $n) | .id' \
                | while read -r a; do curl -sS -X DELETE -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/assets/$a" >/dev/null; done
            fi
            curl -sS -X POST -H "Authorization: Bearer $DST_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" \
              "https://uploads.github.com/repos/$DST_REPO/releases/$did/assets?name=$n" >/dev/null
            echo "uploaded $n"
          done
          curl -sS -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/$did/assets?per_page=100" \
            | jq -r --arg v "$VER" '.[] | select((.name | contains($v) | not) and .name != "latest.json") | "\(.id) \(.name)"' \
            | while read -r a n; do echo "prune $n"; curl -sS -X DELETE -H "Authorization: Bearer $DST_TOKEN" "$dst/releases/assets/$a" >/dev/null; done
          echo "public feed refreshed: https://github.com/$DST_REPO/releases/tag/desktop-preview"
