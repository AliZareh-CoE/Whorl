[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2021"
description = "Atlas — desktop shell over the local Atlas server"
authors = ["Atlas"]
license = "AGPL-3.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools (#389): the release build can open the web inspector on demand (F12 / Diagnostics)
# — a console for the owner when a page misbehaves, without a debug build.
tauri = { version = "2", features = ["devtools"] }
portable-pty = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# keeps the webview using the custom protocol in release builds
custom-protocol = ["tauri/custom-protocol"]
