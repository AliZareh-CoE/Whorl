[project]
name = "atlas"
version = "0.1.0"
description = "Atlas — self-hosted, single-user, research-oriented project management"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "psycopg[binary]>=3.2",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "markdown>=3.8",
    "nh3>=0.2",
    "bibtexparser>=1.4,<2",
    "httpx>=0.28",
    "huey>=2.5",
    "redis>=5.2",
    "mcp>=1.10",
    "piper-tts>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "factory-boy>=3.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "--ds=config.settings.dev"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]
